<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' data:; worker-src 'none'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
  <title>HTML 预览</title>
  <style>
    html,body,iframe { margin:0; inline-size:100%; block-size:100%; border:0; display:block; }
  </style>
</head>
<body>
  <script>
    function render(event) {
      if (event.source !== parent || event.origin !== location.origin || typeof event.data?.html !== 'string') return;
      window.removeEventListener('message', render);
      const frame = document.createElement('iframe');
      frame.setAttribute('sandbox', 'allow-scripts');
      frame.title = 'HTML 页面';
      frame.srcdoc = event.data.html;
      document.body.replaceChildren(frame);
    }
    window.addEventListener('message', render);
  </script>
</body>
</html>
