<!doctype html>
<html lang="zh-CN" data-mode="__MODE__"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101d31;color:#eff6ff;font:15px/1.45 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:clamp(12px,3vw,26px)}h1{font-size:clamp(18px,3.2vw,32px);line-height:1.15;margin:0 0 12px}canvas{display:block;width:100%;height:clamp(155px,49vh,440px);background:radial-gradient(ellipse at 50% 44%,#203858,#132339 75%);border:1px solid #354c68;border-radius:14px}section{margin:.8em 0;min-height:3.8em}h2{font-size:1.12em;margin:0;color:#a6e7ff}p{margin:.2em 0;overflow-wrap:anywhere}
</style><main><h1>__TITLE__</h1><canvas aria-label="动画演示"></canvas><section><h2></h2><p></p></section>
<div id="timeline"></div><noscript>__TRANSCRIPT__</noscript></main>
<script type="application/json" id="scene">__DATA__</script>
<script>
'use strict';
const {template,scenes}=JSON.parse(document.getElementById('scene').textContent);
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
__CLOCK__
const TAU=Math.PI*2, palette=['#6fddff','#ffca78','#98efc8','#d5afff','#ff9caa'];
const colors=i=>palette[(i+palette.length)%palette.length];
let W=1,H=1,shown=-1;
const duration=scenes.length*4;
function line(x,y,X,Y,color,width=2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function dot(x,y,r,color){ctx.beginPath();ctx.arc(x,y,Math.max(.2,r),0,TAU);ctx.fillStyle=color;ctx.fill()}
function text(x,y,value,color='#dcecff'){ctx.fillStyle=color;ctx.textAlign='center';ctx.font='500 13px system-ui';ctx.fillText(value,x,y,Math.min(105,W*.26))}
function poly(points,color,width=2){for(let i=1;i<points.length;i++)line(...points[i-1],...points[i],color,width)}
function paint2d(f,index){
 const angle=f*TAU, cx=W/2,cy=H/2,r=Math.min(W*.28,H*.35), left=W*.13,right=W*.87;
 const labels=scenes.map(s=>s.label), n=Math.max(2,Math.min(8,labels.length));
 const xs=Array.from({length:n},(_,i)=>left+(right-left)*i/(n-1));
 switch(template){
 case 'timeline':
   line(left,cy,right,cy,'#54738a',4);line(left,cy,left+(right-left)*f,cy,colors(0),4);
   xs.forEach((x,i)=>{dot(x,cy,7,colors(i));text(x,cy+(i%2?30:-18),labels[i%labels.length])});break;
 case 'flow':
   xs.forEach((x,i)=>{if(i>0)line(xs[i-1],cy,x,cy,'#70879d');ctx.fillStyle=colors(i);ctx.fillRect(x-12,cy-12,24,24);text(x,cy+34,labels[i%labels.length])});
   dot(left+(right-left)*f,cy,6,'white');break;
 case 'wave':
   for(let j=0;j<3;j++){const points=Array.from({length:101},(_,i)=>[left+(right-left)*i/100,cy+Math.sin(i*.105-angle+j*.7)*r*(.38+j*.16)]);poly(points,colors(j))}
   break;
 case 'orbits':
   dot(cx,cy,11,colors(1));for(let j=1;j<=3;j++){const a=r*j/3;ctx.beginPath();ctx.ellipse(cx,cy,a,a*.63,0,0,TAU);ctx.strokeStyle='#526f88';ctx.stroke();dot(cx+a*Math.cos(angle*(4-j)+j),cy+a*.63*Math.sin(angle*(4-j)+j),5+j,colors(j))}break;
 case 'bars':
   xs.forEach((x,i)=>{const h=(.38+.44*(1+Math.sin(angle+i*1.3))/2)*H;ctx.fillStyle=colors(i);ctx.fillRect(x-W*.018,H*.87-h,W*.036,h);text(x,H*.95,labels[i%labels.length])});break;
 case 'packet':
   {const paths=xs.map((x,i)=>[x,cy+(i%2?1:-1)*r*.48]);poly(paths,'#7392aa',3);paths.forEach(([x,y],i)=>{dot(x,y,9,colors(i));text(x,y+26,labels[i%labels.length])});
   const s=f*(n-1),k=Math.min(n-2,Math.floor(s)),u=s-k;dot(xs[k]+u*(xs[k+1]-xs[k]),paths[k][1]+u*(paths[k+1][1]-paths[k][1]),6,'white')}break;
 case 'tree':
   {const nodes=[[.5,.16],[.29,.45],[.71,.45],[.16,.78],[.39,.78],[.61,.78],[.84,.78]];
   nodes.forEach(([x,y],i)=>{if(i){const p=nodes[Math.floor((i-1)/2)];line(p[0]*W,p[1]*H,x*W,y*H,'#7691aa')}});
   nodes.forEach(([x,y],i)=>dot(x*W,y*H,Math.floor(f*7)===i?13:8,colors(i)))}break;
 case 'spring':
   {const X=cx+r*.75*Math.cos(angle), points=[[left,cy]];for(let i=1;i<24;i++)points.push([left+(X-left)*i/24,cy+(i%2?1:-1)*9]);points.push([X,cy]);poly(points,colors(0),3);dot(X,cy,17,colors(1))}break;
 case 'pendulum':
   {const theta=.8*Math.sin(angle),length=H*.65,x=cx+length*Math.sin(theta),y=H*.14+length*Math.cos(theta);line(cx,H*.14,x,y,colors(0),3);dot(cx,H*.14,5,'white');dot(x,y,15,colors(1))}break;
 case 'radar':
   for(let j=1;j<=4;j++){ctx.beginPath();ctx.arc(cx,cy,r*j/4,0,TAU);ctx.strokeStyle='#4a647e';ctx.stroke()}
   line(cx,cy,cx+r*Math.cos(angle),cy+r*Math.sin(angle),colors(2),3);
   for(let j=1;j<=6;j++)dot(cx+r*.125*j*Math.cos(j*2),cy+r*.125*j*Math.sin(j*2),4,colors(j));break;
 }
}
function paint3d(f,index){
 const a=f*TAU,points=[],edges=[],labels=[];
 function add(x,y,z,c=0,size=3){points.push({x,y,z,c,size});return points.length-1}
 function chain(previous,current){if(previous>=0)edges.push([previous,current]);return current}
 function ring(radius,y,n,c){let start=points.length;for(let i=0;i<n;i++){let t=i/n*TAU;add(radius*Math.cos(t),y,radius*Math.sin(t),c,2);edges.push([start+i,start+(i+1)%n])}return start}
 switch(template){
 case 'process': {
   const spacing=1.8/Math.max(1,scenes.length-1);
   for(let i=0;i<scenes.length;i++){
     const x=scenes.length===1?0:-.9+i*spacing;
     const y=(i%2===0?1:-1)*.18,z=i%2===0?-.24:.24;
     const node=add(x,y,z,i,i===index?10:5);
     if(i)edges.push([node-1,node]);
     labels.push([node,scenes[i].label]);
   }
   const start=points[index],end=points[Math.min(index+1,scenes.length-1)];
   const t=Math.min(1,f*1.35);
   add(start.x+(end.x-start.x)*t,start.y+(end.y-start.y)*t+.14,start.z+(end.z-start.z)*t,1,4);
   break;
 }
 case 'cube':
 case 'layers':
   {const layers=template==='cube'?2:5;for(let j=0;j<layers;j++){const y=(j/(layers-1)-.5)*(template==='cube'?1.35:1.0+.65*Math.sin(a));const first=ring(.95,y,4,j);if(j)for(let i=0;i<4;i++)edges.push([first+i-4,first+i])}}break;
 case 'helix':
   {let l=-1,r=-1;for(let i=0;i<=32;i++){let t=i*.24+a,y=i/17-.95;l=chain(l,add(.55*Math.cos(t),y,.55*Math.sin(t),0));r=chain(r,add(-.55*Math.cos(t),y,-.55*Math.sin(t),3));if(i%3===0)edges.push([l,r])}}break;
 case 'surface':
   for(let j=0;j<11;j++)for(let i=0;i<11;i++){let x=(i-5)/5,z=(j-5)/5,k=add(x,.3*Math.sin(x*3+z*2-a),z,(i+j)%3,2);if(i)edges.push([k-1,k]);if(j)edges.push([k-11,k])}break;
 case 'solar':
   add(0,0,0,1,12);for(let j=1;j<=3;j++){const radius=j*.36,t=a*(4-j)+j;ring(radius,0,40,j);add(radius*Math.cos(t),0,radius*Math.sin(t),j,5+j)}break;
 case 'lattice':
   for(let z=0;z<3;z++)for(let y=0;y<3;y++)for(let x=0;x<3;x++){const k=add((x-1)*.68,(y-1)*.68,(z-1)*.68,(x+y+z)%5,4);if(x)edges.push([k-1,k]);if(y)edges.push([k-3,k]);if(z)edges.push([k-9,k])}break;
 case 'vortex':
   for(let i=0;i<120;i++){let u=(i/120+f)%1,t=u*TAU*4+i*2.4,r=.18+.82*u;add(r*Math.cos(t),u*1.8-.9,r*Math.sin(t),i%4,2+u*2)}break;
 case 'torus':
   for(let j=0;j<24;j++)for(let i=0;i<8;i++){const t=j*TAU/24,b=i*TAU/8,r=.72+.26*Math.cos(b),k=add(r*Math.cos(t),.26*Math.sin(b),r*Math.sin(t),j%3,1.5);edges.push([k,j*8+(i+1)%8],[k,((j+1)%24)*8+i])}break;
 case 'globe':
   for(let j=1;j<8;j++){const lat=j*Math.PI/8,s=ring(Math.sin(lat),Math.cos(lat),24,j%3);if(j>1)for(let i=0;i<24;i+=3)edges.push([s+i-24,s+i])}break;
 case 'arms':
   {let parent=add(0,-.85,0,1,7),x=0,y=-.85,z=0;for(let i=0;i<4;i++){const bend=.7*Math.sin(a+i*.8),turn=i*.8+.45*Math.cos(a+i);x+=.5*Math.sin(bend)*Math.cos(turn);y+=.5*Math.cos(bend);z+=.5*Math.sin(bend)*Math.sin(turn);parent=chain(parent,add(x,y,z,i,7))}}break;
 }
 const yaw=template==='process'?.42:.6+a,pitch=.37,sy=Math.sin(yaw),cy=Math.cos(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const scale=Math.min(W*.32,H*.38);
 const screen=points.map(p=>{const x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,depth=z*cp+p.y*sp,k=3.7/(4-depth);return {x:W/2+x*scale*k,y:H/2-(p.y*cp-z*sp)*scale*k,z:depth,k,c:p.c,size:p.size}});
 for(const [i,j] of edges){const p=screen[i],q=screen[j];line(p.x,p.y,q.x,q.y,'#6587a9',1.35)}
 for(const p of [...screen].sort((l,r)=>l.z-r.z))dot(p.x,p.y,p.size*p.k,colors(p.c));
 for(const [i,label] of labels){
   if(W<640&&Math.abs(i-index)>1)continue;
   const p=screen[i];text(p.x,p.y+(i%2?29:-19),label,i===index?'#ffd47d':'#dcecff')
 }
}
function draw(clock){
 const ratio=Math.min(devicePixelRatio||1,2);W=Math.max(1,canvas.clientWidth);H=Math.max(1,canvas.clientHeight);
 if(canvas.width!==Math.round(W*ratio)||canvas.height!==Math.round(H*ratio)){canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio)}
 ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,W,H);
 const index=Math.min(scenes.length-1,Math.floor(clock/4)),f=Math.min(1,clock/4-index);
 if(index!==shown){shown=index;document.querySelector('h2').textContent=scenes[index].label;document.querySelector('p').textContent=scenes[index].caption}
 if(document.documentElement.dataset.mode==='3d')paint3d(f,index);else paint2d(f,index);
}
const redraw=installAnimationClock(document.getElementById('timeline'),duration,draw);
new ResizeObserver(redraw).observe(canvas);
</script></html>
